[package]
name = "rust-less"
version = "1.0.0"
edition = "2021"
description = "高性能的 LESS 到 CSS 编译器，支持变量、嵌套、颜色函数等核心功能"
license = "MIT"
authors = ["Yang Cheng"]
readme = "README.md"
repository = "https://github.com/YangChengxxyy/rust-less"
keywords = [
    "less",
    "css",
    "compiler",
    "parser",
    "preprocessor",
    "colors",
    "nesting",
]
categories = ["parsing", "web-programming", "development-tools"]

[lib]
name = "rust_less"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust-less"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "rust-less-lsp"
path = "src/bin/lsp.rs"
required-features = ["lsp"]

[features]
default = ["functions"]
cli = ["clap"]
functions = []
serde = ["dep:serde", "dep:serde_json"]
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:serde_json"]
wasm = ["wasm-bindgen", "console_error_panic_hook", "wee_alloc"]

[dependencies]
# Core parsing dependencies
pest = "2.8.0"
pest_derive = "2.8.0"

# CLI feature
clap = { version = "4.0", features = ["derive"], optional = true }

# Serialization support
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Error handling
thiserror = "1.0"

# String and path utilities
regex = "1.0"
indexmap = "2.0"

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

# JavaScript types
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
sourcemap = "9.3.2"

# LSP 服务器依赖
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.95", optional = true }

[dev-dependencies]
criterion = "0.5"
insta = "1.34"
pretty_assertions = "1.4"
wasm-bindgen-test = "0.3"


[[bench]]
name = "compiler_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
