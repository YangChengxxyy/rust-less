name: wasm-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1,wasm-bindgen-cli@0.2.100

      - name: Build WASM packages
        run: ./build-wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-bundle
          path: |
            pkg/
            pkg-nodejs/
            pkg-web/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # secrets 上下文不允许出现在 step 级 if 中，先注入 job 级 env 供条件判断
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg-bundle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Publish rust-less-wasm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rust-less-wasm-node
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        working-directory: pkg-nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rust-less-wasm-web
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        working-directory: pkg-web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
